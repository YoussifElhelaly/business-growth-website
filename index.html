<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>بزنس جروث — استشارات قانونية ومحاسبية وتأسيس شركات</title>
    <meta
      name="description"
      content="مكتب استشارات قانونية ومحاسبية وتأسيس شركات في الرياض، المملكة العربية السعودية."
    />
  </head>
  <body>
    <div id="root">
      <div id="__pre_splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:radial-gradient(120% 95% at 82% -15%, #2f3749 0%, #23293a 38%, #171c28 72%, #171c28 100%);z-index:9999;">
        <div style="width:48px;height:48px;border-radius:999px;border:3px solid rgba(255,255,255,.18);border-top-color:#d9a45f;animation:__spin 0.85s linear infinite;"></div>
        <div style="font-family:'Tajawal',system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;color:#fff;">بزنس جروث</div>
      </div>
    </div>
    <style>@keyframes __spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
