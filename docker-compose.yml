version: "3.8"

services:
  app:
    build: .
    container_name: business-growth-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Map the data directory to a persistent Docker volume
      - bg_data:/app/server/data
      # Map the uploads directory to a persistent Docker volume
      - bg_uploads:/app/server/uploads

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bg-tunnel
    restart: unless-stopped
    command: tunnel --url http://app:4001
    depends_on:
      - app

volumes:
  bg_data:
  bg_uploads:
